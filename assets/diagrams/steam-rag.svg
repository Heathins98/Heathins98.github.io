<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A query is checked by a resolver against known achievements; unresolved questions go through hybrid dense and full-text search fused by reciprocal rank fusion; both paths feed a Claude generation step, all backed by a four-table PostgreSQL and pgvector schema">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#74c7b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="800" rx="10" fill="#161513"/>

  <!-- QUERY -->
  <text x="40" y="26" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">QUERY</text>
  <rect x="488" y="38" width="424" height="60" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
  <text x="700" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#e8e4dc">User question</text>
  <text x="700" y="82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">e.g. "How do I get Legendary Ending?"</text>

  <line x1="700" y1="98" x2="700" y2="140" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="716" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">checked against</text>

  <!-- STAGE 1 — RESOLVE -->
  <text x="40" y="162" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">STAGE 1 — RESOLVE</text>
  <rect x="40" y="174" width="1320" height="70" rx="8" fill="#1b1a18" stroke="#74c7b8" stroke-width="1.5"/>
  <text x="66" y="204" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#e8e4dc">Exact match → fuzzy match</text>
  <text x="66" y="224" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">retrieve/resolver.py · against ~700 known achievement names</text>
  <text x="1334" y="214" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74c7b8">98% acc. on exact names</text>

  <!-- Branch: resolved bypass -->
  <line x1="85" y1="244" x2="85" y2="560" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="100" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#74c7b8">resolved —</text>
  <text x="100" y="354" font-family="'JetBrains Mono', monospace" font-size="10" fill="#74c7b8">skip search</text>

  <!-- Branch: unresolved -->
  <line x1="700" y1="244" x2="700" y2="330" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="716" y="290" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">unresolved</text>

  <!-- STAGE 2 — HYBRID SEARCH -->
  <text x="150" y="318" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">STAGE 2 — HYBRID SEARCH</text>
  <rect x="150" y="330" width="1210" height="140" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>

  <rect x="180" y="350" width="560" height="50" rx="6" fill="#211f1c" stroke="#2a2926" stroke-width="1.5"/>
  <text x="460" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">Dense vector search</text>
  <text x="460" y="388" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">MiniLM embeddings (384-d) in pgvector</text>

  <rect x="760" y="350" width="560" height="50" rx="6" fill="#211f1c" stroke="#2a2926" stroke-width="1.5"/>
  <text x="1040" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">Full-text search</text>
  <text x="1040" y="388" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">PostgreSQL BM25-style keyword ranking</text>

  <line x1="460" y1="400" x2="460" y2="413" stroke="#74c7b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1040" y1="400" x2="1040" y2="413" stroke="#74c7b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="180" y="414" width="1140" height="40" rx="6" fill="#1b1a18" stroke="#74c7b8" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="750" y="439" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e8e4dc">Reciprocal Rank Fusion → ranked chunks</text>

  <line x1="700" y1="470" x2="700" y2="560" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="716" y="520" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">ranked chunks</text>

  <!-- STAGE 3 — GENERATE -->
  <text x="40" y="548" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">STAGE 3 — GENERATE</text>
  <rect x="40" y="560" width="1320" height="90" rx="8" fill="#1b1a18" stroke="#74c7b8" stroke-width="1.5"/>
  <text x="66" y="592" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#e8e4dc">Claude API</text>
  <text x="66" y="612" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">Cited answer grounded in retrieved chunks</text>
  <text x="66" y="630" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">or an explicit decline if the guides don't cover it</text>
  <text x="1334" y="602" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74c7b8">retrieve/generate.py</text>

  <!-- DATA MODEL -->
  <text x="40" y="690" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">DATA MODEL — POSTGRESQL 17 + PGVECTOR</text>
  <text x="1360" y="690" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74c7b8">read by resolve + hybrid search</text>

  <rect x="40" y="702" width="315" height="70" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
  <text x="197" y="730" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">achievements</text>
  <text x="197" y="748" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">~700 rows</text>

  <rect x="375" y="702" width="315" height="70" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
  <text x="532" y="730" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">guides</text>
  <text x="532" y="748" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">Community Guide metadata</text>

  <rect x="710" y="702" width="315" height="70" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
  <text x="867" y="730" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">chunks</text>
  <text x="867" y="748" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">embedding + full-text vector</text>

  <rect x="1045" y="702" width="315" height="70" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
  <text x="1202" y="730" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">achievement_chunks</text>
  <text x="1202" y="748" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">achievement → chunk links</text>
</svg>
