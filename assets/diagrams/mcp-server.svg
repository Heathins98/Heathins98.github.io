<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Five layers from AI clients through the FastMCP server and RFC connection pool to the SAP S/4HANA application server">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#74c7b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="600" rx="10" fill="#161513"/>

  <!-- LAYER 1 — AI CLIENTS -->
  <text x="40" y="26" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">LAYER 1 — AI CLIENTS</text>
  <g font-family="'JetBrains Mono', monospace">
    <rect x="40" y="38" width="424" height="66" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
    <text x="252" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e4dc">SAP Joule</text>
    <text x="252" y="86" text-anchor="middle" font-size="11" fill="#8f8a80">Work Desktop · custom connector</text>

    <rect x="488" y="38" width="424" height="66" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
    <text x="700" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e4dc">Claude / any LLM</text>
    <text x="700" y="86" text-anchor="middle" font-size="11" fill="#8f8a80">via Anthropic API or other MCP client</text>

    <rect x="936" y="38" width="424" height="66" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
    <text x="1148" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e4dc">Generic MCP client</text>
    <text x="1148" y="86" text-anchor="middle" font-size="11" fill="#8f8a80">any MCP-compatible tool</text>
  </g>

  <line x1="700" y1="104" x2="700" y2="146" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="716" y="120" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74c7b8">MCP · streamable HTTP</text>
  <text x="716" y="134" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">POST /mcp — port 8000</text>

  <!-- LAYER 2 — MCP SERVER -->
  <text x="40" y="168" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">LAYER 2 — MCP SERVER</text>
  <rect x="40" y="180" width="1320" height="66" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5"/>
  <text x="66" y="210" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#e8e4dc">FastMCP 2.0 Server</text>
  <text x="66" y="230" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">server.py · Python 3.12 · Pydantic v2 models</text>
  <text x="1334" y="220" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74c7b8">4 registered tools</text>

  <line x1="700" y1="246" x2="700" y2="288" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="716" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">Python function calls</text>

  <!-- LAYER 3 — CONNECTION POOL -->
  <text x="40" y="310" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">LAYER 3 — CONNECTION POOL</text>
  <rect x="40" y="322" width="1320" height="60" rx="8" fill="#1b1a18" stroke="#74c7b8" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="66" y="350" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#e8e4dc">Thread-safe RFC connection pool</text>
  <text x="66" y="370" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">connection.py · 3 connections · lazy init</text>
  <text x="1334" y="360" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#74c7b8">dead-conn auto-retry</text>

  <line x1="700" y1="382" x2="700" y2="420" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>
  <text x="716" y="406" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">pyrfc 3.3.1 → SAP NW RFC SDK 7.50</text>

  <!-- LAYER 4 — RFC TRANSPORT -->
  <text x="40" y="442" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8f8a80" font-weight="600">LAYER 4 — RFC TRANSPORT</text>
  <rect x="40" y="454" width="980" height="56" rx="8" fill="#1b1a18" stroke="#74c7b8" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="530" y="478" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#e8e4dc">SAP RFC binary protocol</text>
  <text x="530" y="496" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8f8a80">port 33xx · direct connection</text>

  <rect x="1040" y="454" width="320" height="56" rx="8" fill="#1b1a18" stroke="#2a2926" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1200" y="478" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e8e4dc">Optional: SAPRouter</text>
  <text x="1200" y="496" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f8a80">multi-hop proxy route</text>

  <line x1="700" y1="510" x2="700" y2="540" stroke="#74c7b8" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- LAYER 5 — SAP S/4HANA -->
  <rect x="40" y="552" width="1320" height="36" rx="6" fill="#1b1a18" stroke="#74c7b8" stroke-width="1.5"/>
  <text x="700" y="575" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#74c7b8">SAP S/4HANA application server  ·  RFC_SYSTEM_INFO · SWNC_COLLECTOR_GET_AGGREGATES · RFC_READ_TABLE → /SDF/SMON_HEADER · TH_WPINFO</text>
</svg>
